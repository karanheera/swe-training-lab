name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install project
        run: python -m pip install .

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run Tests
        run: python -m pytest
  
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/karanheera/order_app:dev \
            -t ghcr.io/karanheera/order_app:${{ github.sha }} \
            .
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ghcr.io/karanheera/order_app:dev
          docker push ghcr.io/karanheera/order_app:${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: self-hosted

    steps:
      - name: Deploy application
        run: |
          docker pull ghcr.io/karanheera/order_app:${{ github.sha }}

          docker rm -f order-app || true

          docker run -d \
            --name order-app \
            --restart unless-stopped \
            -p 8000:8000 \
            -e ENVIRONMENT=production \
            ghcr.io/karanheera/order_app:${{ github.sha }}
          sleep 5
          curl --fail http://127.0.0.1:8000/health
